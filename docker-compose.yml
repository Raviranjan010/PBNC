services:
  postgres:
    image: postgres:16-alpine
    container_name: papermind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-papermind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-papermind_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-papermind_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-papermind} -d ${POSTGRES_DB:-papermind_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: papermind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: papermind-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-papermind}:${POSTGRES_PASSWORD:-papermind_secret_password}@postgres:5432/${POSTGRES_DB:-papermind_db}
      - SYNC_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-papermind}:${POSTGRES_PASSWORD:-papermind_secret_password}@postgres:5432/${POSTGRES_DB:-papermind_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-min-32-chars-papermind}
      - AI_PROVIDER=${AI_PROVIDER:-heuristic}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - storage_data:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python -m alembic -c backend/alembic.ini upgrade head &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: papermind-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-papermind}:${POSTGRES_PASSWORD:-papermind_secret_password}@postgres:5432/${POSTGRES_DB:-papermind_db}
      - SYNC_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-papermind}:${POSTGRES_PASSWORD:-papermind_secret_password}@postgres:5432/${POSTGRES_DB:-papermind_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-min-32-chars-papermind}
      - AI_PROVIDER=${AI_PROVIDER:-heuristic}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A backend.app.core.celery_app.celery_app worker --loglevel=info --concurrency=2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: papermind-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  storage_data:
